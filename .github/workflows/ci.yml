name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core-linux:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v5
      - run: swift test

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -version
      - name: Build untuk iOS Simulator
        run: >
          xcodebuild build
          -scheme Tulis
          -destination 'generic/platform=iOS Simulator'
          -skipMacroValidation
          CODE_SIGNING_ALLOWED=NO

  ipa:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      XTOOL_VERSION: 1.24.0
    steps:
      - uses: actions/checkout@v5
      - name: Pasang xtool
        run: |
          curl -fsSL -o xtool.app.zip "https://github.com/xtool-org/xtool/releases/download/${XTOOL_VERSION}/xtool.app.zip"
          ditto -x -k xtool.app.zip "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xtool.app/Contents/MacOS" >> "$GITHUB_PATH"
      - name: Buat project Xcode
        timeout-minutes: 5
        run: xtool dev generate-xcode-project < /dev/null
      - name: Build Tulis.app tanpa signing
        timeout-minutes: 20
        run: >
          xcodebuild build
          -workspace xtool/Tulis.xcworkspace
          -scheme Tulis-App
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath build
          -skipMacroValidation
          CODE_SIGNING_ALLOWED=NO
      - name: Bungkus Tulis.ipa
        run: |
          app=$(find build/Build/Products -maxdepth 2 -name 'Tulis.app' -type d | head -1)
          test -n "$app"
          mkdir Payload
          cp -R "$app" Payload/
          zip -qry Tulis.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Tulis.ipa
          path: Tulis.ipa
