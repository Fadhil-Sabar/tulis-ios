name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core-linux:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v5
      - run: swift test

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -version
      - name: Build untuk iOS Simulator
        run: >
          xcodebuild build
          -scheme Tulis
          -destination 'generic/platform=iOS Simulator'
          -skipMacroValidation
          CODE_SIGNING_ALLOWED=NO

  ipa:
    runs-on: macos-15
    env:
      XTOOL_VERSION: 1.24.0
    steps:
      - uses: actions/checkout@v5
      - name: Pasang xtool
        run: |
          curl -fsSL -o xtool.app.zip "https://github.com/xtool-org/xtool/releases/download/${XTOOL_VERSION}/xtool.app.zip"
          ditto -x -k xtool.app.zip "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xtool.app/Contents/MacOS" >> "$GITHUB_PATH"
      - name: Build Tulis.app
        run: xtool dev build
      - name: Bungkus Tulis.ipa tanpa signing
        run: |
          mkdir Payload
          cp -R xtool/Tulis.app Payload/
          zip -qry Tulis.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Tulis.ipa
          path: Tulis.ipa
